<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Raidle — Guess the Raid: Shadow Legends champion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="bg-glow" aria-hidden="true"></div>

<header class="site-header">
  <div class="header-inner">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">✦</span>
      <h1>RAIDLE</h1>
    </div>
    <p class="subtitle">Guess the mystery champion from <strong>Raid: Shadow Legends</strong></p>
  </div>
</header>

<main class="game">

  <!-- Mode switch -->
  <div class="mode-switch" role="tablist" aria-label="Game mode">
    <button class="mode-btn is-active" data-mode="daily" role="tab" aria-selected="true">Daily Challenge</button>
    <button class="mode-btn" data-mode="infinite" role="tab" aria-selected="false">Infinite</button>
  </div>

  <!-- Portal / silhouette hero -->
  <section class="portal-wrap">
    <div class="portal" id="portal">
      <div class="portal-ring" aria-hidden="true"></div>
      <div class="portal-ring portal-ring--outer" aria-hidden="true"></div>
      <div class="portal-glow" aria-hidden="true"></div>
      <div class="portal-figure" id="portalFigure">
        <span class="placeholder-glyph">?</span>
      </div>
    </div>
    <p class="portal-caption" id="attemptsCaption">Who is this champion? Try your luck below.</p>
  </section>

  <!-- Guess input -->
  <section class="guess-box">
    <div class="autocomplete" id="autocomplete">
      <input
        type="text"
        id="guessInput"
        class="guess-input"
        placeholder="Type a champion name…"
        autocomplete="off"
        spellcheck="false"
        aria-label="Champion name"
      />
      <ul class="suggestions" id="suggestions" hidden></ul>
    </div>
    <button class="give-up-btn" id="giveUpBtn" type="button">Give up</button>
  </section>

  <!-- Win / lose banner -->
  <section class="result-banner" id="resultBanner" hidden></section>

  <!-- Guesses table -->
  <section class="board-wrap">
    <div class="board-scroll">
      <table class="board" id="board">
        <thead>
          <tr>
            <th class="col-portrait">Champion</th>
            <th>Faction</th>
            <th>Affinité</th>
            <th>Rôle</th>
            <th>Rareté</th>
          </tr>
        </thead>
        <tbody id="boardBody">
        </tbody>
      </table>
    </div>
  </section>

  <p class="legend">
    <span class="legend-item"><span class="legend-swatch legend-swatch--correct"></span> Correct</span>
    <span class="legend-item"><span class="legend-swatch legend-swatch--wrong"></span> Incorrect</span>
    <span class="legend-item"><span class="legend-arrow">↑ / ↓</span> Higher / Lower than the mystery champion</span>
  </p>

</main>

<footer class="site-footer">
  <p>Made for summoners. Champion data are customized by the site owner.</p>
</footer>

<script src="data.js"></script>
<script src="script.js"></script>
</body>
</html>
